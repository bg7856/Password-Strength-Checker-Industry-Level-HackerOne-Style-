<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Strength Checker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    input { padding: 10px; width: 300px; font-size: 16px; }
    #strength { margin-top: 10px; font-weight: bold; }
    .weak { color: red; }
    .medium { color: orange; }
    .strong { color: green; }
  </style>
</head>
<body>
  <h2>Password Strength Checker</h2>
  <input type="password" id="password" placeholder="Enter your password" maxlength="21">
  <div id="strength"></div>

  <script>
    const passwordInput = document.getElementById("password");
    const strengthDisplay = document.getElementById("strength");

    passwordInput.addEventListener("input", () => {
      const pwd = passwordInput.value;
      let message = "";
      let cssClass = "";

      // Length rules
      if (pwd.length < 12) {
        message = "Minimum length is 12 characters";
        cssClass = "weak";
      } else if (pwd.length > 21) {
        message = "Maximum length is 21 characters";
        cssClass = "weak";
      } else {
        // Character type checks
        const hasLower = /[a-z]/.test(pwd);
        const hasUpper = /[A-Z]/.test(pwd);
        const hasNumber = /[0-9]/.test(pwd);
        const hasSymbol = /[^A-Za-z0-9]/.test(pwd);

        const checks = [hasLower, hasUpper, hasNumber, hasSymbol].filter(Boolean).length;

        if (checks < 2) {
          message = "Weak 🔴 (needs more variety)";
          cssClass = "weak";
        } else if (checks === 2 || checks === 3) {
          message = "Medium 🟠 (add missing character types)";
          cssClass = "medium";
        } else if (checks === 4) {
          message = "Strong 🟢 (good mix of characters)";
          cssClass = "strong";
        }
      }

      strengthDisplay.textContent = message;
      strengthDisplay.className = cssClass;
    });
  </script>
</body>
</html>
